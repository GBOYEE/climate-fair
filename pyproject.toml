[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climate-farm"
version = "0.1.0"
description = "Climate-smart agriculture automation"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "twilio>=9.0",
    "pytest>=7.0",
    "reportlab>=4.0",  # for future PDF reports
    "python-multipart>=0.0.9",
]

[project.scripts]
climate-farm = "climate_farm.cli:main"

[tool.black]
line-length = 100

[tool.ruff]
select = ["E", "F", "W"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
